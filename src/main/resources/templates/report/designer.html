<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head th:replace="~{layout :: head('리포트 디자이너')}"></head>
<body>

<header th:replace="~{layout :: gnb('designer')}"></header>

<div class="dz" th:attr="data-report-id=${reportId}">

    <!-- 상단 도구 모음 -->
    <div class="dz-toolbar">
        <label class="field">
            <span>리포트 ID</span>
            <input type="text" id="reportId" th:value="${reportId}" placeholder="BUDGET_EXEC" size="18">
        </label>
        <label class="field">
            <span>리포트명</span>
            <input type="text" id="reportName" placeholder="리포트 이름" size="24">
        </label>
        <label class="field">
            <span>분류</span>
            <input type="text" id="category" placeholder="재정" size="8">
        </label>

        <span class="dz-sep"></span>

        <span class="dz-group-label">요소 추가</span>
        <button class="btn" type="button" data-add="LABEL">라벨</button>
        <button class="btn" type="button" data-add="TEXT">필드</button>
        <button class="btn" type="button" data-add="LINE">선</button>
        <button class="btn" type="button" data-add="RECT">사각형</button>
        <button class="btn" type="button" data-add="QRCODE">QR</button>
        <button class="btn" type="button" data-add="BARCODE">바코드</button>
        <button class="btn" type="button" data-add="CHART">차트</button>

        <span class="spacer"></span>

        <button class="btn" type="button" id="btnValidate">검증</button>
        <button class="btn" type="button" id="btnPreview">미리보기</button>
        <button class="btn primary" type="button" id="btnSave">저장</button>
    </div>

    <div id="dzMessage"></div>

    <div class="dz-body">

        <!-- 좌측: 구조 -->
        <aside class="dz-left">
            <div class="dz-card">
                <h3>용지</h3>
                <div class="dz-form">
                    <label><span>규격</span>
                        <select id="paperSize">
                            <option>A4</option>
                            <option>A3</option>
                            <option>A5</option>
                            <option>B4</option>
                            <option>B5</option>
                            <option>LETTER</option>
                            <option>LEGAL</option>
                        </select>
                    </label>
                    <label><span>방향</span>
                        <select id="orientation">
                            <option value="PORTRAIT">세로</option>
                            <option value="LANDSCAPE">가로</option>
                        </select>
                    </label>
                    <label><span>여백 상</span><input type="number" id="marginTop" step="1"></label>
                    <label><span>여백 하</span><input type="number" id="marginBottom" step="1"></label>
                    <label><span>여백 좌</span><input type="number" id="marginLeft" step="1"></label>
                    <label><span>여백 우</span><input type="number" id="marginRight" step="1"></label>
                </div>
            </div>

            <div class="dz-card">
                <h3>데이터셋 <small>SELECT 만 허용</small></h3>
                <textarea id="sql" rows="8" spellcheck="false"
                          placeholder="select a, b from t where c = :param order by a"></textarea>
                <button class="btn" type="button" id="btnFields" style="margin-top:6px">필드 불러오기</button>
                <div id="fieldList" class="dz-fields"></div>
            </div>

            <div class="dz-card">
                <h3>조회 조건</h3>
                <div id="paramList" class="dz-list"></div>
                <button class="btn" type="button" id="btnAddParam">조건 추가</button>
            </div>

            <div class="dz-card">
                <h3>그룹</h3>
                <div id="groupList" class="dz-list"></div>
                <button class="btn" type="button" id="btnAddGroup">그룹 추가</button>
            </div>

            <div class="dz-card">
                <h3>밴드</h3>
                <div id="bandList" class="dz-list"></div>
                <div class="dz-inline">
                    <select id="newBandType">
                        <option value="REPORT_HEADER">리포트 머리말</option>
                        <option value="PAGE_HEADER">페이지 머리말</option>
                        <option value="GROUP_HEADER">그룹 머리말</option>
                        <option value="DETAIL">본문</option>
                        <option value="GROUP_FOOTER">그룹 꼬리말</option>
                        <option value="PAGE_FOOTER">페이지 꼬리말</option>
                        <option value="REPORT_FOOTER">리포트 꼬리말</option>
                    </select>
                    <button class="btn" type="button" id="btnAddBand">추가</button>
                </div>
            </div>
        </aside>

        <!-- 중앙: 캔버스 -->
        <main class="dz-center">
            <div class="dz-canvas-bar">
                <label class="field"><span>확대</span>
                    <select id="dzZoom">
                        <option value="0.75">75%</option>
                        <option value="1" selected>100%</option>
                        <option value="1.25">125%</option>
                        <option value="1.5">150%</option>
                    </select>
                </label>
                <label class="field"><span>격자</span>
                    <select id="dzGrid">
                        <option value="0">없음</option>
                        <option value="2">2pt</option>
                        <option value="4" selected>4pt</option>
                        <option value="8">8pt</option>
                    </select>
                </label>
                <span class="spacer"></span>
                <span id="dzHint" class="dz-hint">요소를 끌어 옮기고, 오른쪽 아래 모서리로 크기를 바꿉니다. Delete 키로 삭제.</span>
            </div>
            <div class="dz-canvas-wrap">
                <div id="dzCanvas" class="dz-canvas"></div>
            </div>
        </main>

        <!-- 우측: 속성 -->
        <aside class="dz-right">
            <div class="dz-card">
                <h3>속성</h3>
                <div id="props" class="dz-form">
                    <p class="dz-empty">요소를 선택하세요.</p>
                </div>
            </div>
        </aside>
    </div>
</div>

<!-- 미리보기 -->
<div id="previewLayer" class="dz-modal" style="display:none">
    <div class="dz-modal-bar">
        <strong>미리보기</strong>
        <span id="previewStat"></span>
        <span class="spacer"></span>
        <button class="btn" type="button" id="btnClosePreview">닫기</button>
    </div>
    <div class="dz-modal-body">
        <div id="previewCanvas"></div>
    </div>
</div>

<link rel="stylesheet" th:href="@{/css/designer.css}">
<script th:src="@{/js/designer.js}"></script>
</body>
</html>
