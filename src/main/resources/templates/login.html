<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>로그인 - KReport</title>
    <link rel="stylesheet" th:href="@{/css/kreport.css}">
</head>
<body style="display:flex;align-items:center;justify-content:center;min-height:100vh">

<form class="panel" method="post" th:action="@{/login}" style="width:340px;padding:28px">
    <div style="text-align:center;margin-bottom:20px">
        <div style="font-size:20px;font-weight:700;color:var(--primary)">KReport</div>
        <div style="font-size:12px;color:var(--muted);margin-top:2px">웹 리포팅</div>
    </div>

    <div class="msg error" th:if="${param.error}">
        아이디 또는 비밀번호가 올바르지 않습니다.
    </div>
    <div class="msg info" th:if="${param.logout}">
        로그아웃되었습니다.
    </div>

    <div style="display:grid;gap:8px">
        <input type="text" name="username" placeholder="아이디" autocomplete="username" required autofocus>
        <input type="password" name="password" placeholder="비밀번호" autocomplete="current-password" required>
        <button class="btn primary" type="submit" style="height:34px">로그인</button>
    </div>

    <p style="margin:16px 0 0;font-size:11px;color:var(--muted);line-height:1.6">
        리포트 정의를 편집하려면 편집 권한이 필요합니다.
        정의에 쓰는 조회 SQL 은 업무 DB 를 직접 읽으므로 열람 권한과 따로 관리됩니다.
    </p>
</form>

</body>
</html>
